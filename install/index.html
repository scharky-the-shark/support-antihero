<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Misfitz download and installation support."
    >

    <title>Download - Misfitz Support</title>

    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container">
        <section class="page-header">
            <a href="../">← Misfitz Support</a>

            <h1>Download</h1>

            <p>
                Find answers to common questions about registering,
                downloading, and installing Misfitz.
            </p>
        </section>

        <section class="install-filter">
            <label for="platformSelect">Choose platform</label>

            <select id="platformSelect" class="platform-select">
                <option value="all">Choose platform</option>
                <option value="ios">Apple</option>
                <option value="android">Android</option>
            </select>
        </section>

        <section id="installArticles" class="article-grid"></section>
    </main>

    <div id="footer"></div>

    <script src="../script.js"></script>
    <script src="install.js"></script>
</body>
</html>
