<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Official Misfitz Support">
    <title>Misfitz Support</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header"></div>

    <main class="container">
        <section class="hero">
            <h1>Misfitz Support</h1>
            <p>Find answers and information about Misfitz.</p>

            <div class="search">
                <input id="searchInput" type="search" placeholder="Search support..." autocomplete="off">
                <div id="searchResults"></div>
            </div>
        </section>

        <section class="support-grid">
            <a class="support-card" href="install/">
                <h2>Download</h2>
                <p>Questions about downloading Misfitz.</p>
            </a>
            
            <a class="support-card" href="creator/">
                <h2>Creator</h2>
                <p>Guidelines and informations.</p>
            </a>
            
            <a class="support-card" href="game/">
                <h2>Game Support</h2>
                <p>Everything you need to know about Misfitz.</p>
            </a>

            <a class="support-card" href="team/">
                <h2>Team Q&A</h2>
                <p>Questions about the team behind Misfitz.</p>
            </a>
        </section>
    </main>

    <div id="footer"></div>

    <script src="script.js"></script>
</body>
</html>
